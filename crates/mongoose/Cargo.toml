[package]
name        = "mongoose"
version     = { workspace = true }
edition     = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
description = "Copy one NFS path to another and keep it in sync until cutover"
publish     = false

[lib]
name = "mongoose"
path = "src/lib.rs"

[[bin]]
name = "mongoose"
path = "src/main.rs"

[dependencies]
migration-core     = { workspace = true }
migration-mover    = { workspace = true }
# No `distributed` feature: mongoose needs shard processing only, not
# the S3 orchestrator or the coordinator HTTP client (PR-11B).
migration-worker   = { path = "../migration-worker", default-features = false }
mig-walker-rewrite = { path = "../mig-walker-rewrite" }
migration-resync   = { path = "../migration-resync" }
arrow              = { workspace = true }
parquet            = { workspace = true }
base64             = { workspace = true }

# The scanner, compiled in so mongoose ships as one binary. Pinned to
# a commit on walker main, the one packaging/nfs-walker.lock.json
# records; bump the lock and this rev
# together (docs/PRODUCTION_RELEASE_HANDOFF.md, PR-01/PR-02).
# default-features = false drops the optional analytics dashboard
# (datafusion/axum/rust-embed) — mongoose only needs the walk engine.
nfs-walker = { git = "https://github.com/blakegolliher/nfs-walker", rev = "360ad3fc15120663d182d1aebd884f20d5bfe872", default-features = false }

tokio              = { workspace = true }
tokio-util         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
async-trait        = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
chrono             = { workspace = true }
hex                = { workspace = true }
libc               = { workspace = true }
sha2               = "0.10.9"

[dev-dependencies]
tempfile = "3"
