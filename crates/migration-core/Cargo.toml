[package]
name        = "migration-core"
version     = { workspace = true }
edition     = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
description = "Shared types, S3 protocol, and parquet schema for the migration system"
publish     = false

[dependencies]
# Only with the `s3` feature (see [features]).
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }

arrow   = { workspace = true }
parquet = { workspace = true }

# "process" on top of the workspace features: `prepare_tools` spawns
# nfs-walker / mig-walker-rewrite as child processes.
tokio      = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
chrono     = { workspace = true }
base64     = { workspace = true }
bytes      = { workspace = true }
uuid       = { workspace = true }
hex        = { workspace = true }
memmap2    = { workspace = true }
async-trait = { workspace = true }
futures    = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# prepare_tools filesystem-discovery tests.
tempfile = "3"

[features]
# The S3 client (`s3` module, `Error::S3`) and the AWS SDK it needs.
# Off by default: only the distributed engine (mig-worker's
# `distributed` feature, migration-coord) talks to S3, and mongoose
# must not link the AWS/TLS stack.
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
# Exposes `claim::test_util` (the in-memory mock ClaimStore used by
# this crate's own protocol tests) to downstream crates' tests, so
# integration harnesses don't fork a divergent copy of the mock.
test-util = []
