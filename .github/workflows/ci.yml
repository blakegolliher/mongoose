# Baseline CI (PR-11A): formatting, Clippy, workspace tests, ShellCheck, and
# the repository-level LGPL policy check. The cargo-deny job (PR-11B) checks
# advisories, licenses, bans, and sources for the whole workspace.
#
# This workflow validates the checked-in workspace only. It never builds,
# uploads, or publishes a release artifact.
#
# Every Cargo gate links a static libnfs archive built from the fork commit
# pinned in packaging/libnfs.lock.json; the distro libnfs-dev lacks symbols
# mongoose needs. The build maps the source, build, and Zig paths to fixed
# names, so the archive must match the locked release digest byte for byte
# even though Zig is installed at a different path here. `make release`
# enforces the same digest and the full LGPL gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Keep a cold workspace build within the runner's disk: CI gains
      # nothing from incremental artifacts, and line tables keep backtrace
      # locations without full debug info.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck
          jq --version
          shellcheck --version | sed -n 2p
          cmake --version | head -n1
          ar --version | head -n1
          ranlib --version | head -n1

      - name: Refuse a system libnfs
        run: |
          if dpkg-query -W -f='${Status}' libnfs-dev 2>/dev/null | grep -q 'install ok installed'; then
            echo "::error::libnfs-dev is installed; CI must link the pinned libnfs fork"
            exit 1
          fi
          if command -v pkg-config >/dev/null && pkg-config --exists libnfs; then
            echo "::error::a system libnfs is visible to pkg-config; CI must link the pinned libnfs fork"
            exit 1
          fi

      - name: Install locked Rust toolchain
        run: |
          rust=$(jq -r .rustc packaging/release-toolchain.lock.json)
          cargo_version=$(jq -r .cargo packaging/release-toolchain.lock.json)
          rustup toolchain install "$rust" --profile minimal --component rustfmt --component clippy
          rustup default "$rust"
          rustc --version
          cargo --version
          [[ "$(rustc --version)" == "rustc $rust "* ]] || { echo "::error::rustc is not $rust"; exit 1; }
          [[ "$(cargo --version)" == "cargo $cargo_version "* ]] || { echo "::error::cargo is not $cargo_version"; exit 1; }

      - name: Install locked Zig
        run: |
          zig_version=$(jq -r .zig packaging/release-toolchain.lock.json)
          # SHA-256 of the official x86_64-linux tarball, from
          # https://ziglang.org/download/index.json. Add the matching digest
          # here whenever the lock's Zig version changes.
          case "$zig_version" in
            0.16.0) zig_sha256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
            *) echo "::error::no pinned tarball digest for Zig $zig_version"; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/$zig_version/zig-x86_64-linux-$zig_version.tar.xz"
          echo "$zig_sha256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          test "$("$RUNNER_TEMP/zig/zig" version)" = "$zig_version"
          echo "Zig $zig_version"

      - name: Build pinned libnfs and check its locked digest
        run: |
          url=$(jq -r .source_url packaging/libnfs.lock.json)
          sha=$(jq -r .source_git_sha packaging/libnfs.lock.json)
          git init -q "$RUNNER_TEMP/libnfs"
          git -C "$RUNNER_TEMP/libnfs" fetch --depth 1 "$url" "$sha"
          git -C "$RUNNER_TEMP/libnfs" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/libnfs" rev-parse HEAD)" = "$sha"
          echo "libnfs $url @ $sha"
          EXPECTED_LIBNFS_SHA256="$(jq -er .static_artifact_sha256 packaging/libnfs.lock.json)" \
          EXPECTED_ZIG_VERSION="$(jq -r .zig packaging/release-toolchain.lock.json)" \
          ZIG="$RUNNER_TEMP/zig/zig" \
          ./scripts/build-libnfs-static.sh \
            --source "$RUNNER_TEMP/libnfs" \
            --output "$RUNNER_TEMP/libnfs-stage"
          echo "VAMOOSE_LIBNFS_DIR=$RUNNER_TEMP/libnfs-stage" >> "$GITHUB_ENV"
          echo "NFS_WALKER_LIBNFS_DIR=$RUNNER_TEMP/libnfs-stage" >> "$GITHUB_ENV"

      - name: Check declared minimum Rust version
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustc "+$msrv" --version
          [[ "$(rustc "+$msrv" --version)" == "rustc $msrv "* ]] || {
            echo "::error::rustc is not declared MSRV $msrv"
            exit 1
          }
          CARGO_TARGET_DIR="$RUNNER_TEMP/msrv-target" \
            cargo "+$msrv" check --workspace --all-targets --locked
          cargo "+$msrv" clean --target-dir "$RUNNER_TEMP/msrv-target"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: shellcheck
        run: shellcheck scripts/*.sh packaging/relink-kit/*.sh

      - name: make compliance-check
        run: make compliance-check

      - name: Disk usage
        if: always()
        run: df -h / "$RUNNER_TEMP"

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Change both together. The digest is the upstream release's published
      # .sha256 for the x86_64-unknown-linux-musl tarball.
      CARGO_DENY_VERSION: 0.19.9
      CARGO_DENY_SHA256: f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked Rust toolchain
        run: |
          rust=$(jq -r .rustc packaging/release-toolchain.lock.json)
          rustup toolchain install "$rust" --profile minimal
          rustup default "$rust"
          [[ "$(rustc --version)" == "rustc $rust "* ]] || { echo "::error::rustc is not $rust"; exit 1; }

      - name: Install pinned cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          test "$(cargo deny --version)" = "cargo-deny $CARGO_DENY_VERSION"

      # A new advisory can turn this job red on an unrelated change. Fix or
      # escalate it; see deny.toml before adding any ignore entry.
      - name: cargo deny
        run: cargo deny --locked check advisories licenses bans sources
