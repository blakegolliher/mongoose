[workspace]
resolver = "2"
members = [
    "crates/migration-core",
    "crates/migration-control-protocol",
    "crates/migration-mover",
    "crates/migration-worker",
    "crates/migration-coord",
    "crates/mig-walker-rewrite",
    "crates/migration-resync",
    "crates/mongoose",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Blake Golliher"]
license = "MIT"
rust-version = "1.91.1"
repository = "https://github.com/blakegolliher/mongoose"
description = "Single-host NFS-to-NFS data mover with incremental resync"
readme = "README.md"

[workspace.dependencies]
# Internal
migration-core             = { path = "crates/migration-core" }
migration-control-protocol = { path = "crates/migration-control-protocol" }
migration-mover            = { path = "crates/migration-mover" }
migration-coord            = { path = "crates/migration-coord" }

# AWS / S3 (engine crates only, behind migration-core's opt-in `s3`
# feature; mongoose does no S3 I/O and its graph excludes these)
# aws-sdk-s3's defaults minus `rustls`, which only adds the legacy
# hyper-0.14/rustls-0.21 connector (RUSTSEC h2 0.3, rustls-webpki
# 0.101). With `BehaviorVersion::latest()` the SDK already uses the
# `default-https-client` stack, so dropping it changes no behavior.
aws-sdk-s3   = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config   = "1"
aws-smithy-types-convert = { version = "0.60", features = ["convert-chrono"] }

# Parquet / Arrow (match nfs-walker's version family)
arrow   = { version = "59.2", default-features = false, features = ["ipc"] }
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serde
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
anyhow    = "1"
thiserror = "1"

# Tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"
file-rotate        = "0.7"

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Utilities
chrono     = { version = "0.4", features = ["serde"] }
base64     = "0.22"
bytes      = "1"
humansize  = "2"
uuid       = { version = "1", features = ["v4", "serde"] }
hex        = "0.4"
toml       = "0.8"
hostname   = "0.4"
getrandom  = "0.2"
futures    = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Concurrency primitives (same as nfs-walker)
crossbeam-channel = "0.5"
crossbeam-deque   = "0.8"

# memory-mapped parquet
memmap2 = "0.9"

# Coord HTTP layer (REST + SSE)
axum        = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "macros", "matched-path"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower       = { version = "0.5", default-features = false, features = ["util"] }
tower-http  = { version = "0.6", default-features = false, features = ["trace", "timeout"] }
http        = "1"

# libnfs FFI (see migration-mover/build.rs)
libc = "0.2"

# trait async fns over dyn
async-trait = "0.1"

# Imperative async stream construction (SSE handler)
async-stream = "0.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
opt-level = 1
